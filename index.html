<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lekkxygold tutor | GitHub + Supabase Video</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090b10;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lesson-wrapper {
      width: 100%;
      max-width: 960px;
      background: #121622;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .badge {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f5d061;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 6px 12px;
      border-radius: 999px;
    }
    #sceneCounter {
      font-size: 13px;
      color: #94a3b8;
    }
    .stage-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #05070c;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-gold {
      background: linear-gradient(135deg, #f5d061, #d4af37);
      color: #090b10;
    }
    .btn-dark {
      background: #1e2538;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-record {
      background: #dc2626;
      color: #ffffff;
      margin-left: auto;
    }
    .voice-select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 12px;
    }
    select {
      background: #0b0e17;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      max-width: 100%;
    }
    .status-note {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="lesson-wrapper">
    <div class="top-bar">
      <span class="badge">lekkxygold tutor • GitHub + Supabase Video</span>
      <span id="sceneCounter">Scene 1 / 5</span>
    </div>

    <div class="stage-box">
      <canvas id="lessonCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="controls">
      <button id="playBtn" class="btn-gold">▶ Play Video</button>
      <button id="pauseBtn" class="btn-dark" disabled>⏸ Pause</button>
      <button id="prevBtn" class="btn-dark">⏮ Prev</button>
      <button id="nextBtn" class="btn-dark">Next ⏭</button>
      <button id="restartBtn" class="btn-dark">↺ Replay</button>
      <button id="recordBtn" class="btn-record">⏺ Record Video File</button>
    </div>

    <div class="voice-select-wrap">
      <label for="voiceSelect">Narrator Voice:</label>
      <select id="voiceSelect"></select>
    </div>

    <p id="statusNote" class="status-note">
      Click "Play Video" to start the lekkxygold tutor lesson with voice sound. Tip: Use "Record Video File" to export a downloadable .webm video.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
